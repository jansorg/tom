version: 2

release:
  draft: true

builds:
  - main: .
    id: tom
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # macOS: Apple Silicon only, Linux and Windows: amd64 only
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
  - main: ./go-tom-pdf
    id: tom-pdf
    binary: tom-pdf
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # macOS: Apple Silicon only, Linux and Windows: amd64 only
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

# Signs and notarizes the macOS binaries. This runs on Linux, no macOS machine is needed.
# Skipped if the signing secrets are not available, e.g. for local snapshot builds.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - tom
        - tom-pdf
      sign:
        # base64-encoded .p12 file with the "Developer ID Application" certificate and its private key
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        # App Store Connect API key, the .p8 key file is base64-encoded
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

nfpms:
  - formats:
      - deb
    vendor: "https://github.com/jansorg/tom"
    homepage: "https://github.com/jansorg/tom"
    maintainer: "Joachim Ansorg <tom@ja-dev.eu>"
    description: "Tom is a command line tool to track time"
    license: ""
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ title .Os }}{{ end }}-
      {{- if eq .Arch "386" }}x86{{ else }}{{ .Arch }}{{ end }}
    bindir: /usr/bin
    contents:
      - src: "scripts/completions/tom.sh"
        dst: "/etc/bash_completion.d/tom.sh"
    overrides:
      deb:
        dependencies:
          - bash-completion

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "386" }}x86{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^prep:'
      - '^wip'
